<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DbD サバイバー パーク＆キャラガチャ（完全版）</title>
<style>
  :root {
    --bg-color: #0d0d10;
    --panel-bg: #18181f;
    --border-color: #3a3a4a;
    --accent-purple: #8e44ad;
    --accent-teal: #16a085;
    --accent-amber: #d35400;
    --accent-gold: #f1c40f;
    --text-main: #f0f0f5;
    --slot-height: 90px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 28px 16px 120px;
    background-image: radial-gradient(circle at center, #1e1626 0%, #0d0d10 100%);
  }
  h1 { font-size: 1.7rem; margin-bottom: 14px; letter-spacing: 0.1em; text-shadow: 0 2px 6px rgba(0,0,0,0.95), 0 0 12px rgba(142,68,173,0.6); text-align: center; }
  .mode-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; background: #111116; padding: 6px; border-radius: 10px; border: 1px solid #2e2e3d; }
  .mode-tab { background: transparent; color: #9a9ab0; border: 1px solid transparent; padding: 10px 20px; font-size: 0.95rem; font-weight: bold; border-radius: 7px; cursor: pointer; transition: all 0.2s ease; }
  .mode-tab:hover:not(:disabled) { color: #fff; background: rgba(255,255,255,0.05); }
  .mode-tab.active[data-mode="preset"] { background: linear-gradient(135deg, #8e44ad, #5e2a75); color: #fff; border-color: #b565d8; box-shadow: 0 2px 10px rgba(142,68,173,0.4); }
  .mode-tab.active[data-mode="random"] { background: linear-gradient(135deg, #16a085, #0e6655); color: #fff; border-color: #48c9b0; box-shadow: 0 2px 10px rgba(22,160,133,0.4); }
  .mode-tab.active[data-mode="survivor"] { background: linear-gradient(135deg, #d35400, #873600); color: #fff; border-color: #f39c12; box-shadow: 0 2px 10px rgba(211,84,0,0.4); }
  .mode-tab:disabled { opacity: 0.5; cursor: not-allowed; }
  .slot-machine { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 12px; padding: 24px 24px 32px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(142,68,173,0.2); width: 100%; max-width: 980px; transition: border-color 0.3s ease; }
  .slot-machine.random-mode { border-color: #245c52; box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(22,160,133,0.2); }
  .slot-machine.survivor-mode { border-color: #6e3512; box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(211,84,0,0.2); }
  .preset-banner { background: #08080c; border: 1px solid #3c2a4d; border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; text-align: center; height: 102px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 18px rgba(0,0,0,0.95); }
  .random-mode .preset-banner { border-color: #1f4e45; }
  .survivor-mode .preset-banner { border-color: #5c2d10; }
  .preset-category { font-size: 0.88rem; color: #c9a6e8; margin-bottom: 6px; letter-spacing: 0.05em; user-select: text; font-weight: bold; line-height: 1.2; }
  .random-mode .preset-category { color: #76d7c4; }
  .survivor-mode .preset-category { color: #f5b041; }
  .preset-title { font-size: 1.45rem; font-weight: 900; color: #ffffff; letter-spacing: 0.06em; user-select: text; line-height: 1.3; padding: 4px 18px; border: 1px solid transparent; border-radius: 6px; background: transparent; transition: color 0.25s, background-color 0.25s, border-color 0.25s; }
  .preset-title.revealed { color: #ffd700; background: rgba(255,215,0,0.12); border-color: rgba(255,215,0,0.5); text-shadow: 0 2px 0 #000, 0 -1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 4px 10px rgba(0,0,0,0.9); }
  .random-mode .preset-title.revealed { color: #2ef2c8; background: rgba(46,242,200,0.12); border-color: rgba(46,242,200,0.5); }
  .survivor-mode .preset-title.revealed { color: #ffae34; background: rgba(255,174,52,0.14); border-color: rgba(255,174,52,0.55); }
  .reels-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .reels-container.single-reel { grid-template-columns: minmax(280px, 460px); justify-content: center; }
  @media (max-width: 768px) { .reels-container { grid-template-columns: repeat(2, 1fr); } .reels-container.single-reel { grid-template-columns: 1fr; } }
  @media (max-width: 480px) { .reels-container { grid-template-columns: 1fr; } }
  .reel-col { display: flex; flex-direction: column; gap: 8px; }
  .reel-window { position: relative; height: calc(var(--slot-height) * 3); background: #050508; border: 2px solid #2c2c38; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.98); transition: border-color 0.2s, box-shadow 0.2s; }
  .reel-col.locked .reel-window { border-color: var(--accent-gold); box-shadow: inset 0 0 20px rgba(0,0,0,0.95), 0 0 12px rgba(241,196,15,0.5); }
  .reel-window::after { content: ""; position: absolute; top: var(--slot-height); left: 0; right: 0; height: var(--slot-height); border-top: 2px solid #c36ee8; border-bottom: 2px solid #c36ee8; background: transparent; pointer-events: none; z-index: 4; box-shadow: inset 0 0 14px rgba(142,68,173,0.45); }
  .random-mode .reel-window::after { border-top-color: #36e2c0; border-bottom-color: #36e2c0; box-shadow: inset 0 0 14px rgba(22,160,133,0.45); }
  .survivor-mode .reel-window::after { border-top-color: #f39c12; border-bottom-color: #f39c12; box-shadow: inset 0 0 14px rgba(243,156,18,0.45); }
  .reel-col.locked .reel-window::after { border-top-color: var(--accent-gold); border-bottom-color: var(--accent-gold); box-shadow: inset 0 0 16px rgba(241,196,15,0.45); }
  .reel-window::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(5,5,8,0.94) 0%, rgba(5,5,8,0.72) 32%, rgba(5,5,8,0) 34%, rgba(5,5,8,0) 66%, rgba(5,5,8,0.72) 68%, rgba(5,5,8,0.94) 100%); z-index: 3; pointer-events: none; }
  .reel-strip { display: flex; flex-direction: column; will-change: transform; position: relative; z-index: 1; }
  .perk-cell { height: var(--slot-height); display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px 12px; font-weight: bold; font-size: 0.96rem; line-height: 1.3; border-bottom: 1px solid #1a1a22; color: #9898ad; user-select: text; cursor: text; position: relative; }
  .perk-cell.winner { background: radial-gradient(circle at center, #2d1940 0%, #130b1c 100%); color: #ffe866; font-weight: 900; font-size: 1.06rem; letter-spacing: 0.02em; text-shadow: 0 2px 0 #000, 0 -1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 3px 8px rgba(0,0,0,0.95); cursor: pointer; z-index: 5; animation: winnerGlow 0.4s ease-out; }
  .perk-cell.winner:hover { filter: brightness(1.12); }
  .random-mode .perk-cell.winner { background: radial-gradient(circle at center, #113832 0%, #091c19 100%); color: #5effdf; }
  .survivor-mode .perk-cell.winner { background: radial-gradient(circle at center, #3d230d 0%, #1c1006 100%); color: #ffc857; font-size: 1.2rem; }
  .reel-col.locked .perk-cell.winner { background: radial-gradient(circle at center, #3d320d 0%, #1c1605 100%); color: #ffd700; }
  @keyframes winnerGlow { 0% { filter: brightness(1.5); } 100% { filter: brightness(1); } }
  .copy-toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(24,24,34,0.96); border: 1px solid #b565d8; color: #fff; padding: 10px 22px; border-radius: 30px; font-size: 0.9rem; font-weight: bold; box-shadow: 0 6px 20px rgba(0,0,0,0.7); opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 999; }
  .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .lock-btn { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #3c3c4e; background: #14141c; color: #b0b0c5; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
  .lock-btn:hover:not(:disabled) { background: #1f1f2b; color: #fff; }
  .lock-btn.locked { background: rgba(241,196,15,0.18); border-color: var(--accent-gold); color: #ffeaa7; }
  .lock-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .controls-area { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .exclude-option { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: #ddd; cursor: pointer; user-select: none; background: #111117; padding: 8px 16px; border-radius: 6px; border: 1px solid #2e2e3d; }
  .exclude-option input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent-purple); cursor: pointer; }
  .random-mode .exclude-option input[type="checkbox"] { accent-color: var(--accent-teal); }
  .survivor-mode .exclude-option input[type="checkbox"] { accent-color: var(--accent-amber); }
  .status-bar { font-size: 0.85rem; color: #a8a8bd; }
  .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  button.primary-btn { background: linear-gradient(135deg, #8e44ad, #5e2a75); color: #fff; border: 1px solid #b565d8; padding: 14px 44px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; letter-spacing: 0.08em; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(142,68,173,0.4); }
  button.primary-btn:hover:not(:disabled) { background: linear-gradient(135deg, #9b59b6, #6c3483); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(142,68,173,0.6); }
  .random-mode button.primary-btn { background: linear-gradient(135deg, #16a085, #0e6655); border-color: #48c9b0; box-shadow: 0 4px 15px rgba(22,160,133,0.4); }
  .random-mode button.primary-btn:hover:not(:disabled) { background: linear-gradient(135deg, #1abc9c, #117864); box-shadow: 0 6px 20px rgba(22,160,133,0.6); }
  .survivor-mode button.primary-btn { background: linear-gradient(135deg, #d35400, #873600); border-color: #f39c12; box-shadow: 0 4px 15px rgba(211,84,0,0.4); }
  .survivor-mode button.primary-btn:hover:not(:disabled) { background: linear-gradient(135deg, #e67e22, #a04000); box-shadow: 0 6px 20px rgba(211,84,0,0.6); }
  button.primary-btn:disabled { background: #2c2c35; border-color: #444; color: #777; cursor: not-allowed; box-shadow: none; }
  button.sub-btn { background: #252530; color: #e0e0ea; border: 1px solid #454558; padding: 8px 14px; font-size: 0.82rem; border-radius: 6px; cursor: pointer; }
  button.sub-btn:hover:not(:disabled) { background: #323242; }
  button.sub-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .hidden { display: none !important; }
  .filter-section { margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px; }
  .toggle-header { width: 100%; background: #121218; border: 1px solid #353546; color: #e2e2ec; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .toggle-header:hover { background: #1c1c26; }
  .filter-body { margin-top: 12px; background: #101015; border: 1px solid #2b2b38; border-radius: 8px; padding: 16px 16px 20px; }
  .filter-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #262633; }
  .char-cards-wrapper { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 8px; max-height: 440px; overflow-y: auto; padding: 2px 4px 12px 0; }
  @media (max-width: 520px) { .char-cards-wrapper { grid-template-columns: 1fr; } }
  .char-card { background: #15151e; border: 1px solid #2b2b3a; border-radius: 8px; padding: 9px 12px; transition: opacity 0.2s, border-color 0.2s; }
  .char-card.all-off { opacity: 0.45; }
  .char-card.shared-card { grid-column: 1 / -1; }
  .category-group { margin-bottom: 16px; }
  .category-group:last-child { margin-bottom: 0; }
  .category-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .category-header { font-size: 0.86rem; font-weight: bold; color: #c39bd3; cursor: pointer; user-select: none; flex: 1; padding: 3px 0; display: flex; align-items: center; gap: 6px; }
  .random-mode .category-header { color: #76d7c4; }
  .random-mode .category-header:hover { color: #a3e4d7; }
  .char-count-badge { font-size: 0.72rem; color: #8f8fa3; font-weight: normal; }
  .char-toggle-btn { background: #222230; border: 1px solid #3c3c50; color: #ccc; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .char-toggle-btn:hover { background: #2f2f42; color: #fff; }
  .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-top: 8px; }
  .survivor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; max-height: 440px; overflow-y: auto; padding-right: 4px; }
  .perk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #242432; }
  .shared-card .perk-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  @media (max-width: 600px) { .perk-grid { grid-template-columns: 1fr; } }
  .preset-item, .perk-item, .survivor-item { display: flex; align-items: center; gap: 6px; background: #1c1c28; border: 1px solid #2e2e40; padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 0.78rem; line-height: 1.25; }
  .preset-item { align-items: flex-start; padding: 8px 10px; font-size: 0.84rem; }
  .survivor-item { padding: 8px 10px; font-size: 0.84rem; }
  .preset-item:hover, .perk-item:hover { border-color: #6c3483; }
  .random-mode .perk-item:hover { border-color: #16a085; }
  .survivor-item:hover { border-color: #d35400; }
  .preset-item.unchecked, .perk-item.unchecked, .survivor-item.unchecked { opacity: 0.38; }
  .preset-item input, .perk-item input, .survivor-item input { accent-color: var(--accent-purple); cursor: pointer; flex-shrink: 0; }
  .random-mode .perk-item input { accent-color: var(--accent-teal); }
  .survivor-item input { accent-color: var(--accent-amber); }
  .preset-item-info { display: flex; flex-direction: column; gap: 3px; }
  .preset-item-name { font-weight: bold; color: #f0f0f5; }
  .preset-item-perks { font-size: 0.75rem; color: #9a9ab0; line-height: 1.3; }
</style>
</head>
<body>
  <h1>DBD SURVIVOR PERK &amp; CHAR GACHA</h1>
  <div class="mode-tabs">
    <button type="button" class="mode-tab active" data-mode="preset">プリセット構成ガチャ</button>
    <button type="button" class="mode-tab" data-mode="random">全パーク完全ランダム</button>
    <button type="button" class="mode-tab" data-mode="survivor">サバイバーガチャ</button>
  </div>

  <div class="slot-machine" id="slot-machine">
    <div class="preset-banner">
      <div class="preset-category" id="preset-category">【プリセット構成モード】</div>
      <div class="preset-title" id="preset-title">？？？</div>
    </div>

    <div class="reels-container" id="reels-container">
      <div class="reel-col" id="reel-col-0">
        <div class="reel-window"><div class="reel-strip" id="reel-0"></div></div>
        <button type="button" class="lock-btn hidden" id="lock-btn-0">🔓 固定する</button>
      </div>
      <div class="reel-col" id="reel-col-1">
        <div class="reel-window"><div class="reel-strip" id="reel-1"></div></div>
        <button type="button" class="lock-btn hidden" id="lock-btn-1">🔓 固定する</button>
      </div>
      <div class="reel-col" id="reel-col-2">
        <div class="reel-window"><div class="reel-strip" id="reel-2"></div></div>
        <button type="button" class="lock-btn hidden" id="lock-btn-2">🔓 固定する</button>
      </div>
      <div class="reel-col" id="reel-col-3">
        <div class="reel-window"><div class="reel-strip" id="reel-3"></div></div>
        <button type="button" class="lock-btn hidden" id="lock-btn-3">🔓 固定する</button>
      </div>
    </div>

    <div class="controls-area">
      <label class="exclude-option" id="preset-exclude-wrap">
        <input type="checkbox" id="preset-auto-exclude">
        <span>一度出た構成を次回から外す（自動でチェックを外す）</span>
      </label>
      <label class="exclude-option hidden" id="random-exclude-wrap">
        <input type="checkbox" id="random-auto-exclude">
        <span>一度出たパークを次回から外す（自動でチェックを外す）</span>
      </label>
      <label class="exclude-option hidden" id="survivor-exclude-wrap">
        <input type="checkbox" id="survivor-auto-exclude">
        <span>一度出たサバイバーを次回から外す（自動でチェックを外す）</span>
      </label>
      <div class="status-bar" id="status-bar">抽選対象：43 / 43 構成</div>
      <div class="btn-group">
        <button class="primary-btn" id="spin-btn">ガチャを回す</button>
        <button type="button" class="sub-btn" id="reset-display-btn" style="padding: 14px 20px; font-size: 0.95rem;">出目を？？？に戻す</button>
      </div>
    </div>

    <div class="filter-section" id="preset-filter-section">
      <button type="button" class="toggle-header" id="preset-toggle-btn">
        <span>▼ 抽選対象の構成を個別にオン・オフ設定</span><span id="preset-toggle-text">閉じる</span>
      </button>
      <div class="filter-body" id="preset-filter-body">
        <div class="filter-toolbar">
          <div class="btn-group">
            <button type="button" class="sub-btn" id="preset-check-all">すべてオン（リセット）</button>
            <button type="button" class="sub-btn" id="preset-uncheck-all">すべてオフ</button>
          </div>
          <span style="font-size: 0.8rem; color: #999;">※チェックが入っている構成のみ抽選されます</span>
        </div>
        <div id="preset-list-container"></div>
      </div>
    </div>

    <div class="filter-section hidden" id="random-filter-section">
      <button type="button" class="toggle-header" id="random-toggle-btn">
        <span>▼ 抽選対象のパークをサバイバー・共有別にオン・オフ設定</span><span id="random-toggle-text">閉じる</span>
      </button>
      <div class="filter-body" id="random-filter-body">
        <div class="filter-toolbar">
          <div class="btn-group">
            <button type="button" class="sub-btn" id="random-check-all">すべてオン（リセット）</button>
            <button type="button" class="sub-btn" id="random-uncheck-all">すべてオフ</button>
            <button type="button" class="sub-btn" id="random-expand-all">すべて開く</button>
            <button type="button" class="sub-btn" id="random-collapse-all">すべて閉じる</button>
          </div>
          <span style="font-size: 0.8rem; color: #999;">※キャラ名クリックで開閉／一括切替で3種オンオフ</span>
        </div>
        <div class="char-cards-wrapper" id="perk-list-container"></div>
      </div>
    </div>

    <div class="filter-section hidden" id="survivor-filter-section">
      <button type="button" class="toggle-header" id="survivor-toggle-btn">
        <span>▼ 抽選対象のサバイバーを個別にオン・オフ設定</span><span id="survivor-toggle-text">閉じる</span>
      </button>
      <div class="filter-body" id="survivor-filter-body">
        <div class="filter-toolbar">
          <div class="btn-group">
            <button type="button" class="sub-btn" id="survivor-check-all">すべてオン（リセット）</button>
            <button type="button" class="sub-btn" id="survivor-uncheck-all">すべてオフ</button>
          </div>
          <span style="font-size: 0.8rem; color: #999;">※未所持キャラのチェックを外して抽選できます</span>
        </div>
        <div class="survivor-grid" id="survivor-list-container"></div>
      </div>
    </div>
  </div>
  <div class="copy-toast" id="copy-toast">コピーしました！</div>
<script>
  const CATEGORIZED_PERKS = [
    { category: "【ドワイト・フェアフィールド】", perks: ["絆", "有能の証明", "リーダー"] },
    { category: "【メグ・トーマス】", perks: ["素早く静かに", "全力疾走", "アドレナリン"] },
    { category: "【クローデット・モレル】", perks: ["共感", "植物学の知識", "セルフケア"] },
    { category: "【ジェイク・パーク】", perks: ["鋼の意思", "魂の平穏", "サボタージュ"] },
    { category: "【ネア・カールソン】", perks: ["スマートな着地", "都会の逃走術", "都会の生存術"] },

  function stripParentheses(text) { return text.replace(/[（(][^）)]*[）)]/g, "").trim(); }

  function copyTextWithToast(rawText) {
    if (!rawText || rawText === "？？？") return;
    const selection = window.getSelection().toString();
    if (selection && selection.length > 0) return;
    const cleanText = stripParentheses(rawText);
    if (!cleanText) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cleanText).then(() => showToast(`「${cleanText}」をコピーしました`));
    } else {
      const ta = document.createElement("textarea");
      ta.value = cleanText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast(`「${cleanText}」をコピーしました`);
    }
  }

  function showToast(msg) {

  function getActivePresetIndices() { return Array.from(presetListContainer.querySelectorAll('input[type="checkbox"]:checked')).map(c => Number(c.dataset.buildIndex)); }
  function getActivePerks() { return Array.from(perkListContainer.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.dataset.perkName); }
  function getActiveSurvivors() { return Array.from(survivorListContainer.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.dataset.survivorName); }

  function updateStatus() {
    if (currentMode === "preset") {
      const active = getActivePresetIndices();
      statusBar.textContent = `抽選対象：${active.length} / ${PRESET_BUILDS.length} 構成`;
      if (!isSpinning) spinBtn.disabled = active.length === 0;
    } else if (currentMode === "random") {
      refreshAllCharCardStates();
      const activePerks = getActivePerks();
      const lockedPerks = lockedSlots.map((isL, i) => isL ? currentSlotPerks[i] : null).filter(Boolean);
      const unlockedCount = lockedSlots.filter(isL => !isL).length;
      const availableForSpin = activePerks.filter(p => !lockedPerks.includes(p));
      statusBar.textContent = `抽選対象：${activePerks.length} / ${UNIQUE_ALL_PERKS.length} パーク（固定中：${lockedPerks.length}枠）`;
      if (!isSpinning) spinBtn.disabled = unlockedCount === 0 || availableForSpin.length < unlockedCount;
    } else {
      const activeSurv = getActiveSurvivors();
      statusBar.textContent = `抽選対象：${activeSurv.length} / ${ALL_SURVIVORS.length} 人`;
      if (!isSpinning) spinBtn.disabled = activeSurv.length === 0;
    }
  }
  function getRandomDummyItem(excludeList = []) {
    let pool = PRESET_PERK_POOL;
    if (currentMode === "random") pool = UNIQUE_ALL_PERKS;
    else if (currentMode === "survivor") pool = ALL_SURVIVORS;
    const candidates = pool.filter(p => !excludeList.includes(p));
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function createPerkCell(text, isWinner = false) {
    const cell = document.createElement("div");
    cell.className = isWinner ? "perk-cell winner" : "perk-cell";
    cell.textContent = text;
    if (isWinner) {
      cell.dataset.isWinner = "true";
      cell.title = "クリックでコピー";
      cell.addEventListener("click", () => copyTextWithToast(text));
    }
    return cell;
  }

  function initReels() {
    currentSlotPerks = ["？？？", "？？？", "？？？", "？？？"];
    const targetStrips = currentMode === "survivor" ? strips.slice(0, 1) : strips;
    targetStrips.forEach(strip => {
      strip.innerHTML = "";
      for (let i = 0; i < 3; i++) {
        const text = i === 1 ? "？？？" : getRandomDummyItem();
        strip.appendChild(createPerkCell(text, false));
      }
      strip.style.transition = "none";
      strip.style.transform = "translateY(0px)";
    });
  }

  function pickPreset() {
    const activeIndices = getActivePresetIndices();
    if (activeIndices.length === 0) return null;
    const candidates = activeIndices.length > 1 ? activeIndices.filter(idx => idx !== lastSelectedIndex) : activeIndices;
    const chosenIndex = candidates[Math.floor(Math.random() * candidates.length)];
    lastSelectedIndex = chosenIndex;
    return { build: PRESET_BUILDS[chosenIndex], index: chosenIndex };
  }

  function pickRandomPerksWithLocks() {
    const activePerks = getActivePerks();
    const result = [...currentSlotPerks];
    const used = [];
    lockedSlots.forEach((isLocked, i) => { if (isLocked) used.push(result[i]); });
    for (let i = 0; i < REEL_COUNT; i++) {
      if (!lockedSlots[i]) {
        const candidates = activePerks.filter(p => !used.includes(p));
        if (candidates.length === 0) return null;
        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        result[i] = chosen;
        used.push(chosen);
      }
    }
    return result;
  }

  function pickRandomSurvivor() {
    const activeSurv = getActiveSurvivors();
    if (activeSurv.length === 0) return null;
    const candidates = activeSurv.length > 1 ? activeSurv.filter(name => name !== lastSelectedSurvivor) : activeSurv;
    const chosen = candidates[Math.floor(Math.random() * candidates.length)];
    lastSelectedSurvivor = chosen;
    return chosen;
  }

  function setControlsDisabled(disabled) {
    spinBtn.disabled = disabled;
    resetDisplayBtn.disabled = disabled;
    modeTabs.forEach(tab => tab.disabled = disabled);
    lockBtns.forEach(btn => btn.disabled = disabled);

  function spin() {
    let winners = [];
    let pickedPreset = null;
    let pickedSurvivor = null;

    if (currentMode === "preset") {
      pickedPreset = pickPreset();
      if (!pickedPreset) return;
      winners = pickedPreset.build.perks;
      categoryEl.textContent = "【構成を抽選中...】";
    } else if (currentMode === "random") {
      winners = pickRandomPerksWithLocks();
      if (!winners) return;
      categoryEl.textContent = "【パークをランダム抽選中...】";
    } else {
      pickedSurvivor = pickRandomSurvivor();
      if (!pickedSurvivor) return;
      winners = [pickedSurvivor];
      categoryEl.textContent = "【サバイバーをランダム抽選中...】";
    }

    isSpinning = true;
    setControlsDisabled(true);
    titleEl.classList.remove("revealed");
    titleEl.textContent = "？？？";
    currentSlotPerks = [...winners];

    const activeReelIndices = [];
    const loopCount = currentMode === "survivor" ? 1 : REEL_COUNT;
    for (let i = 0; i < loopCount; i++) {
      if (!(currentMode === "random" && lockedSlots[i])) activeReelIndices.push(i);
    }
    const lastSpinIndex = activeReelIndices[activeReelIndices.length - 1];

    activeReelIndices.forEach(index => {
      const strip = strips[index];
      const currentNames = Array.from(strip.children).slice(0, 3).map(c => c.textContent);
      const dummyCount = 24 + index * 10;
      const newOrder = [getRandomDummyItem([winners[index]]), winners[index], getRandomDummyItem([winners[index]])];
      for (let i = 0; i < dummyCount; i++) newOrder.push(getRandomDummyItem());
      newOrder.push(...currentNames);

      strip.innerHTML = "";
      newOrder.forEach((name, idx) => {
        const cell = createPerkCell(name, false);
        if (idx === 1) cell.dataset.isWinner = "true";
        strip.appendChild(cell);
      });

      const startY = -(newOrder.length - 3) * CELL_HEIGHT;
      strip.style.transition = "none";
      strip.style.transform = `translateY(${startY}px)`;
      strip.getBoundingClientRect();

      const duration = currentMode === "survivor" ? 2.0 : (1.6 + index * 0.45);
      strip.style.transition = `transform ${duration}s cubic-bezier(0.12, 0.85, 0.22, 1)`;
      strip.style.transform = "translateY(0px)";

      strip.ontransitionend = () => {
        const winnerCell = strip.querySelector('[data-is-winner="true"]');
        if (winnerCell) {
          winnerCell.classList.add("winner");
          winnerCell.title = "クリックでコピー";
          winnerCell.addEventListener("click", () => copyTextWithToast(winnerCell.textContent));
        }

        if (index === lastSpinIndex) {
          if (currentMode === "preset") {
            categoryEl.textContent = pickedPreset.build.category;
            titleEl.textContent = `■ ${pickedPreset.build.name}`;
            if (presetAutoExclude.checked) {
              const targetChk = presetListContainer.querySelector(`input[data-build-index="${pickedPreset.index}"]`);
              if (targetChk) { targetChk.checked = false; targetChk.closest(".preset-item").classList.add("unchecked"); }
            }
          } else if (currentMode === "random") {
            categoryEl.textContent = "【全パーク完全ランダムモード】";
            titleEl.textContent = "■ ランダム構成 決定！";
            if (randomAutoExclude.checked) {
              winners.forEach((perkName, slotIdx) => {
                if (!lockedSlots[slotIdx]) {
                  const targetChk = perkListContainer.querySelector(`input[data-perk-name="${perkName}"]`);
                  if (targetChk) { targetChk.checked = false; targetChk.closest(".perk-item").classList.add("unchecked"); }
                }
              });
            }
          } else {
            categoryEl.textContent = "【サバイバーランダム抽選モード】";
            titleEl.textContent = `■ ${pickedSurvivor}`;
            if (survivorAutoExclude.checked) {

              if (targetChk) { targetChk.checked = false; targetChk.closest(".survivor-item").classList.add("unchecked"); }
            }
          }
          titleEl.classList.add("revealed");
          isSpinning = false;
          setControlsDisabled(false);
          saveCurrentModeToMemory();
          saveState();
          updateStatus();
        }
      };
    });
  }

  spinBtn.addEventListener("click", spin);

  const STORAGE_KEY = "dbd_gacha_save_v2";

  function saveState() {
    if (!isSpinning) saveCurrentModeToMemory();
    const uncheckedPresets = [];
    presetListContainer.querySelectorAll('input[type="checkbox"]').forEach(chk => { if (!chk.checked) uncheckedPresets.push(Number(chk.dataset.buildIndex)); });
    const uncheckedPerks = [];
    perkListContainer.querySelectorAll('input[type="checkbox"]').forEach(chk => { if (!chk.checked) uncheckedPerks.push(chk.dataset.perkName); });
    const uncheckedSurvivors = [];
    survivorListContainer.querySelectorAll('input[type="checkbox"]').forEach(chk => { if (!chk.checked) uncheckedSurvivors.push(chk.dataset.survivorName); });

    const data = {
      currentMode,
      presetAutoExclude: presetAutoExclude.checked,
      randomAutoExclude: randomAutoExclude.checked,
      survivorAutoExclude: survivorAutoExclude.checked,
      uncheckedPresets,
      uncheckedPerks,
      uncheckedSurvivors,
      modeStates
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadState() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return false; }
    if (!raw) return false;

    try {
      const data = JSON.parse(raw);
      presetAutoExclude.checked = !!data.presetAutoExclude;
      randomAutoExclude.checked = !!data.randomAutoExclude;
      survivorAutoExclude.checked = !!data.survivorAutoExclude;

      if (Array.isArray(data.uncheckedPresets)) {
        const offSet = new Set(data.uncheckedPresets);
        presetListContainer.querySelectorAll('input[type="checkbox"]').forEach(chk => {
          const isOff = offSet.has(Number(chk.dataset.buildIndex));
          chk.checked = !isOff;
          chk.closest(".preset-item").classList.toggle("unchecked", isOff);
        });
      }
      if (Array.isArray(data.uncheckedPerks)) {
        const offSet = new Set(data.uncheckedPerks);
        perkListContainer.querySelectorAll('input[type="checkbox"]').forEach(chk => {
          const isOff = offSet.has(chk.dataset.perkName);
          chk.checked = !isOff;
          chk.closest(".perk-item").classList.toggle("unchecked", isOff);
        });
      }
      if (Array.isArray(data.uncheckedSurvivors)) {
        const offSet = new Set(data.uncheckedSurvivors);
        survivorListContainer.querySelectorAll('input[type="checkbox"]').forEach(chk => {
          const isOff = offSet.has(chk.dataset.survivorName);
          chk.checked = !isOff;
          chk.closest(".survivor-item").classList.toggle("unchecked", isOff);
        });
      }
      if (data.modeStates) {
        ["preset", "random", "survivor"].forEach(m => { if (data.modeStates[m]) modeStates[m] = { ...modeStates[m], ...data.modeStates[m] }; });
      }

      const targetMode = (data.currentMode && ["preset", "random", "survivor"].includes(data.currentMode)) ? data.currentMode : "preset";
      currentMode = targetMode;
      modeTabs.forEach(tab => tab.classList.toggle("active", tab.dataset.mode === targetMode));

      const isPreset = targetMode === "preset", isRandom = targetMode === "random", isSurvivor = targetMode === "survivor";
      slotMachineEl.classList.toggle("random-mode", isRandom);
      slotMachineEl.classList.toggle("survivor-mode", isSurvivor);
      reelsContainerEl.classList.toggle("single-reel", isSurvivor);
      reelCols.forEach((col, i) => col.classList.toggle("hidden", isSurvivor && i > 0));

      presetExcludeWrap.classList.toggle("hidden", !isPreset);
      presetFilterSection.classList.toggle("hidden", !isPreset);
      randomExcludeWrap.classList.toggle("hidden", !isRandom);
      randomFilterSection.classList.toggle("hidden", !isRandom);
      survivorExcludeWrap.classList.toggle("hidden", !isSurvivor);
      survivorFilterSection.classList.toggle("hidden", !isSurvivor);
      lockBtns.forEach(btn => btn.classList.toggle("hidden", !isRandom));

      restoreModeFromMemory(targetMode);
      return true;
    } catch (e) { return false; }
  }

  [presetListContainer, perkListContainer, survivorListContainer].forEach(c => c.addEventListener("change", saveState));
  [presetAutoExclude, randomAutoExclude, survivorAutoExclude].forEach(c => c.addEventListener("change", saveState));
  modeTabs.forEach(t => t.addEventListener("click", saveState));
  lockBtns.forEach(b => b.addEventListener("click", saveState));
  document.addEventListener("click", e => { if (e.target.matches(".sub-btn, .char-toggle-btn")) saveState(); });
  setInterval(() => { if (!isSpinning) saveState(); }, 2000);

  buildPresetFilterList();
  buildPerkFilterList();
  buildSurvivorFilterList();
  if (!loadState()) initReels();
  updateStatus();
</script>
</body>
</html>
